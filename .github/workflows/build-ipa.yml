name: Build iOS Unsigned IPA

# 一次编译出一个未签名真机 IPA（Artifact + 打 tag 时发布 Release）：
#   TiebaLite-<版本>-<SHA>.ipa  最低 iOS 17；同一份二进制在 iOS 26+ 上运行时吃满液态玻璃等全部特性
#                        （26 专属能力全走 #available 分支，17/18 上自动退回该系统年代的材质）。
# 未签名（ad-hoc 签名）真机 IPA，供 SideStore / AltStore 重签侧载。
# 纯 Swift + Bazel：无 Node / npm / Metro / CocoaPods，也不需要任何 Apple 账号或 secret。
#
# 为什么 ad-hoc 等于"无签名"口径：rules_apple 对设备构建强制要求每个 bundle 都有
# provisioning_profile 工件（ios_rules.bzl 无条件挂 partial），但把签名身份设为
# ad-hoc（--ios_signing_cert_name=-）时它明确不拿该描述文件去签名
# （codesigning_support.bzl:528）。所以 Build 步现场生成一个
# 结构合法的占位件，产物是 ad-hoc 签名、无团队标识 —— 侧载工具会重签，不影响安装。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        options:
          - Release
          - Debug
        default: Release
      tag_name:
        description: '发布到的 tag（如 v2.1.1；留空则只出 Artifact 不发 Release）'
        type: string
        required: false
        default: ''
      release_title:
        description: 'Release 标题（留空则用 tag 名）'
        type: string
        required: false
        default: ''
      release_notes:
        description: 'Release 说明（发布 Release 时填这里的文本）'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up test Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: A · Prepare and verify toolchain
        id: toolchain
        run: |
          diagnostics="$RUNNER_TEMP/tieba-ci"
          mkdir -p "$diagnostics"
          log="$diagnostics/toolchain.log"
          trap 'cat "$log"' EXIT
          sw_vers > "$log"
          uname -m >> "$log"
          python3 --version >> "$log"
          xcodebuild -version >> "$log"
          if ! grep -q '^Xcode 26\.' "$log"; then
            echo "::error::The macos-26 runner must select Xcode 26.x"
            exit 1
          fi
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          printf 'iPhoneOS SDK %s\n' "$sdk_version" >> "$log"
          if [[ "$sdk_version" != 26 && "$sdk_version" != 26.* ]]; then
            echo "::error::Expected an iPhoneOS 26.x SDK"
            exit 1
          fi
          macos_sdk=$(xcrun --sdk macosx --show-sdk-version)
          printf 'macOS SDK %s\n' "$macos_sdk" >> "$log"
          swiftc_path=$(xcrun --sdk macosx --find swiftc)
          "$swiftc_path" --version >> "$log"
          dirname "$swiftc_path" >> "$GITHUB_PATH"

          if ! command -v bazelisk >/dev/null; then
            brew install bazelisk
          fi
          expected_bazel=$(tr -d '\r' < .bazelversion)
          actual_bazel=$(bazelisk --version)
          printf '%s\n' "$actual_bazel" >> "$log"
          if [[ "$expected_bazel" != 9.2.0 || "$actual_bazel" != "bazel $expected_bazel" ]]; then
            echo "::error::Expected Bazel 9.2.0 from .bazelversion"
            exit 1
          fi

      # Bazel 磁盘/仓库缓存：命中后整包十几秒（冷编约 100 s）。
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.bazel_cache/disk
            ~/.bazel_cache/repository
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion', 'BUILD.bazel', '**/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # ⚠️ 缓存要真的生效，必须让 Bazel 知道去哪读写：之前 actions/cache 只负责存/取
      # ~/.bazel_cache/{disk,repository}，但仓库里没有任何 --disk_cache / --repository_cache
      # 设置（.bazelrc 里那两行是"复制到 .bazelrc.user"的模板，而 .bazelrc.user 被 gitignore
      # ⇒ runner 上根本不存在）—— 缓存步一直在存/取一个空目录。这里在构建前把 .bazelrc.user
      # 写出来（.bazelrc 用 try-import 引入，缺了也不报错，本地开发机各自维护自己那份）。
      - name: Enable Bazel disk/repository cache
        run: |
          cat > .bazelrc.user <<EOF
          build --disk_cache=$HOME/.bazel_cache/disk
          build --repository_cache=$HOME/.bazel_cache/repository
          EOF
          cat .bazelrc.user

      # 拆分卡口：//Sources/TiebaNative:Proto 这个 target 依赖那 267 个 protoc 产物是 public
      # （protoc-gen-swift 默认生成 internal，跨 module 不可见）。若有人用默认可见性重新生成，
      # 拆分会在编译期挂掉且报错点在生成物里、很难定位 —— 所以在构建前先拦一次，并给出正确姿势。
      - name: Verify protoc-generated visibility
        id: protobuf_visibility
        run: |
          # 没拆 Proto target 的树上跳过：判据只对拆过的树成立。
          if ! grep -q 'name = "Proto"' Sources/TiebaNative/BUILD.bazel; then
            echo "skip: 本分支未拆 //Sources/TiebaNative:Proto，无需校验生成物可见性"
            exit 0
          fi
          generated=(Sources/TiebaNative/Proto/Generated/*.pb.swift)
          if [[ ! -f "${generated[0]}" ]]; then
            echo "::error::No SwiftProtobuf generated sources found"
            exit 1
          fi
          missing=0
          for file in "${generated[@]}"; do
            if ! grep -q 'public ' "$file"; then
              echo "::error file=$file::Regenerate with protoc-gen-swift --swift_opt=Visibility=Public"
              missing=$((missing + 1))
            fi
          done
          printf 'SwiftProtobuf generated files=%s missing public visibility=%s\n' "${#generated[@]}" "$missing"
          [[ "$missing" == 0 ]]

      - name: B · Python source regression checks
        id: source_checks
        run: |
          python3 -u docs/bugfix/dynamic-feed-thread/run_dynamic_feed_thread_tests.py --check-sources
          python3 -u docs/bugfix/deep-link/run_deep_link_tests.py --check-sources
          python3 -u docs/bugfix/http-retry/run_retry_tests.py --check-sources
          python3 -u docs/features/composer/run_composer_tests.py --check-sources --suite-only
          python3 -u docs/features/private-message/run_private_message_tests.py --check-sources --suite-only
          python3 -u docs/bugfix/dynamic-reply-routing/run_dynamic_reply_routing_tests.py --check-sources

      - name: C0 · Check macOS Swift toolchain and run Foundation smoke test
        id: swift_host
        run: |
          diagnostics="$RUNNER_TEMP/tieba-ci"
          mkdir -p "$diagnostics"
          python3 -u docs/ci/swift_host_toolchain.py 2>&1 | tee "$diagnostics/swift-host.log"

      - name: C · Swift offline regressions and Protobuf validation
        id: swift_checks
        run: |
          python3 -u docs/bugfix/dynamic-reply-routing/run_dynamic_reply_routing_tests.py
          python3 -u docs/bugfix/dynamic-feed-thread/run_dynamic_feed_thread_tests.py
          python3 -u docs/bugfix/deep-link/run_deep_link_tests.py
          python3 -u docs/bugfix/http-retry/run_retry_tests.py
          python3 -u docs/features/composer/run_composer_tests.py --suite-only
          python3 -u docs/features/private-message/run_private_message_tests.py --suite-only

      - name: D · Build iOS App
        id: app_build
        run: |
          # ── 占位描述文件（原先的 Tools/make-unsigned-profile.sh，2026-10-07 内联到这里）──
          # rules_apple 对设备构建强制要求每个 bundle 都有 provisioning_profile 工件
          # （ios_rules.bzl 无条件挂 partial），且会解析它的 plist 取 entitlements；
          # 身份设成 ad-hoc（--ios_signing_cert_name=-）时 rules_apple 不拿它签名
          # （codesigning_support.bzl:528），所以只需要一个结构合法、键齐全的容器。
          # 自签一张一次性证书只为产出 CMS 结构；不涉及任何 Apple 凭据，产物也不进仓库。
          mkdir -p Signing
          keep=0
          for out in Signing/app.mobileprovision Signing/ext.mobileprovision; do
            if [ -f "$out" ] && [ "$(wc -c < "$out" | tr -d ' ')" -gt 4096 ]; then keep=1; fi
          done
          if [ "$keep" = "1" ]; then
            echo "keep existing provisioning profiles (look real)"
          else
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            cat > "$tmp/profile.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>AppIDName</key><string>BuildPlaceholder</string>
          <key>ApplicationIdentifierPrefix</key><array><string>0000000000</string></array>
          <key>CreationDate</key><date>2026-01-01T00:00:00Z</date>
          <key>Platform</key><array><string>iOS</string></array>
          <key>Entitlements</key><dict/>
          <key>ExpirationDate</key><date>2040-01-01T00:00:00Z</date>
          <key>Name</key><string>BuildPlaceholder</string>
          <key>TeamIdentifier</key><array><string>0000000000</string></array>
          <key>TeamName</key><string>BuildPlaceholder</string>
          <key>TimeToLive</key><integer>3650</integer>
          <key>UUID</key><string>00000000-0000-0000-0000-000000000000</string>
          <key>Version</key><integer>1</integer>
          </dict></plist>
          PLIST
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tmp/key.pem" -out "$tmp/cert.pem" \
              -days 3650 -subj "/CN=BuildPlaceholder" 2>/dev/null
            for out in Signing/app.mobileprovision Signing/ext.mobileprovision; do
              openssl smime -sign -in "$tmp/profile.plist" -signer "$tmp/cert.pem" -inkey "$tmp/key.pem" \
                -nodetach -outform der -out "$out" 2>/dev/null
              echo "wrote $out ($(wc -c < "$out" | tr -d ' ') bytes)"
            done
          fi
          mode=$([ "$CONFIGURATION" = "Release" ] && echo release || echo debug)
          bazelisk build //:App --config=ci --config="$mode"

      - name: E · Package unsigned IPA
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          mode=$([ "$CONFIGURATION" = "Release" ] && echo release || echo debug)
          bazelisk build //:AppStripped --config=ci --config="$mode"
          version=unsigned
          if [[ -n "$RELEASE_TAG" ]]; then
            version=$(printf '%s' "$RELEASE_TAG" | LC_ALL=C tr -c 'A-Za-z0-9._+-' '-')
          fi
          ipa_name="TiebaLite-${version}-${GITHUB_SHA}.ipa"
          mkdir -p build/Payload
          unzip -oq bazel-bin/AppStripped.ipa -d build
          minimum_os=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/Payload/*.app/Info.plist)
          printf 'MinimumOSVersion=%s\n' "$minimum_os"
          [[ "$minimum_os" == 17.0 ]]
          ( cd build && zip -qry "$ipa_name" Payload )
          unzip -tq "build/$ipa_name"
          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"

      - name: F · Upload IPA artifact
        id: upload_ipa
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.sha }}
          path: build/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record failure diagnostics
        if: failure()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          PROTOBUF_OUTCOME: ${{ steps.protobuf_visibility.outcome }}
          SOURCE_OUTCOME: ${{ steps.source_checks.outcome }}
          SWIFT_HOST_OUTCOME: ${{ steps.swift_host.outcome }}
          SWIFT_OUTCOME: ${{ steps.swift_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.app_build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_ipa.outcome }}
        run: |
          diagnostics="$RUNNER_TEMP/tieba-ci"
          mkdir -p "$diagnostics"
          printf '%s\n' \
            "commit=$GITHUB_SHA" \
            "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "configuration=$CONFIGURATION" \
            "checkout=$CHECKOUT_OUTCOME" "python=$PYTHON_OUTCOME" \
            "toolchain=$TOOLCHAIN_OUTCOME" "protobuf_visibility=$PROTOBUF_OUTCOME" \
            "source_checks=$SOURCE_OUTCOME" "swift_host=$SWIFT_HOST_OUTCOME" \
            "swift_checks=$SWIFT_OUTCOME" "app_build=$BUILD_OUTCOME" \
            "package=$PACKAGE_OUTCOME" "upload_ipa=$UPLOAD_OUTCOME" > "$diagnostics/status.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tieba-ci/status.log
            ${{ runner.temp }}/tieba-ci/toolchain.log
            ${{ runner.temp }}/tieba-ci/swift-host.log
          if-no-files-found: warn
          retention-days: 14

  # 构建产物出来后发 Release，挂上那一个 IPA。
  # 只在"手动触发且填了 tag_name"或"push 了 v* tag"时执行。
  release:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPAs
        uses: actions/download-artifact@v4
        with:
          name: ipa-${{ github.sha }}
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_title != '') && inputs.release_title || (github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name) }}
          body: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          files: dist/*.ipa
          fail_on_unmatched_files: true
